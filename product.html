<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-nature | Manage Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #2C2C2C; color: white; padding: 20px 0; position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        .sidebar-brand { text-align: center; padding: 10px 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1.4rem; font-weight: 700; }
        .sidebar-brand span { color: #FF6B35; }
        .menu-item { display: flex; align-items: center; padding: 12px 25px; color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.2s; cursor: pointer; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid #FF6B35; }
        .menu-item i { margin-right: 15px; font-size: 1.1rem; width: 20px; text-align: center; }
        .main-content { margin-left: 260px; flex: 1; padding: 30px; width: calc(100% - 260px); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .data-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .prod-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .btn-main { background: #FF6B35; color: white; border: none; border-radius: 8px; }
        .btn-main:hover { background: #e85a2a; color: white; }
        @media (max-width: 991px) { .sidebar { margin-left: -260px; } .sidebar.active { margin-left: 0; } .main-content { margin-left: 0; width: 100%; } }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">AR-<span>nature</span></div>
        <div class="sidebar-menu">
            <a href="index.html" class="menu-item"><i class="fas fa-store"></i> Store Front</a>
            <a href="admin.html" class="menu-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="order.html" class="menu-item"><i class="fas fa-box"></i> Orders</a>
            <div class="menu-item active"><i class="fas fa-couch"></i> Products</div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-bar">
            <h2>Manage Products</h2>
            <div>
                <button class="btn btn-outline-dark d-lg-none me-2" onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fas fa-bars"></i></button>
                <button class="btn btn-main" onclick="openProductModal()"><i class="fas fa-plus me-2"></i>Add Product</button>
            </div>
        </div>

        <div class="data-card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>3D Model</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT PRODUCT MODAL -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="productModalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Product Name</label>
                            <input type="text" class="form-control" id="pName" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Price (₹)</label>
                                <input type="number" class="form-control" id="pPrice" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Category</label>
                                <select class="form-select" id="pCategory" required>
                                    <option value="">Loading...</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Image URL</label>
                            <input type="url" class="form-control" id="pImage" required placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">3D Model File (.glb)</label>
                            <input type="text" class="form-control" id="pModel" required placeholder="sofa.glb">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Description</label>
                            <textarea class="form-control" id="pDesc" rows="3"></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-main" id="saveProductBtn">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = './api';
        let allProducts = [];
        let allCategories = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchCategories();
            fetchProducts();
        });

        async function fetchCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories.php`);
                allCategories = await res.json();
                const select = document.getElementById('pCategory');
                select.innerHTML = allCategories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
            } catch (e) { console.error(e); }
        }

        async function fetchProducts() {
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Loading...</td></tr>';
            try {
                const res = await fetch(`${API_BASE}/products.php`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Fetch failed');
                allProducts = data;
                renderTable();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('productsTableBody');
            if (allProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No products found</td></tr>';
                return;
            }
            tbody.innerHTML = allProducts.map(p => `
                <tr>
                    <td><img src="${p.image_url}" class="prod-img" alt="${p.name}"></td>
                    <td class="fw-bold">${p.name}</td>
                    <td>${p.categories ? p.categories.name : 'N/A'}</td>
                    <td>₹${parseInt(p.price).toLocaleString()}</td>
                    <td><code>${p.model_file}</code></td>
                    <td>
                        <button class="btn btn-sm btn-outline-dark me-1" onclick="editProduct(${p.id})" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id}, '${p.name}')" title="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openProductModal(id = null) {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModalTitle').textContent = 'Add Product';
            document.getElementById('saveProductBtn').textContent = 'Save Product';
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        function editProduct(id) {
            const p = allProducts.find(prod => prod.id === id);
            if (!p) return;
            
            document.getElementById('productModalTitle').textContent = 'Edit Product';
            document.getElementById('saveProductBtn').textContent = 'Update Product';
            document.getElementById('productId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pCategory').value = p.category_id || '';
            document.getElementById('pImage').value = p.image_url;
            document.getElementById('pModel').value = p.model_file;
            document.getElementById('pDesc').value = p.description || '';
            
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const payload = {
                name: document.getElementById('pName').value,
                price: parseInt(document.getElementById('pPrice').value),
                category_id: parseInt(document.getElementById('pCategory').value),
                image_url: document.getElementById('pImage').value,
                model_file: document.getElementById('pModel').value,
                description: document.getElementById('pDesc').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/products.php?id=${id}` : `${API_BASE}/products.php`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Save failed');

                bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
                fetchProducts();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deleteProduct(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"? This cannot be undone.`)) return;
            try {
                const res = await fetch(`${API_BASE}/products.php?id=${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Delete failed');
                fetchProducts();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
</html>

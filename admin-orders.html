<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders - AR-nature</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .sidebar { height: 100vh; background: #2C2C2C; color: white; padding: 20px; position: fixed; width: 250px; }
        .sidebar a { color: #aaa; text-decoration: none; display: block; padding: 10px 0; }
        .sidebar a:hover, .sidebar a.active { color: #FF6B35; }
        .main-content { margin-left: 250px; padding: 30px; }
        .order-card { border-left: 5px solid #FF6B35; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="mb-4">AR-nature Admin</h4>
        <a href="admin.html">🛍 Products</a>
        <a href="admin-orders.html" class="active">📦 Orders</a>
        <a href="index.html">🌐 View Store</a>
    </div>

    <div class="main-content">
        <h2>Incoming Orders</h2>
        <div class="mt-4" id="ordersContainer">
            <div class="text-center text-muted py-5">Loading orders...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api/orders';

        async function loadOrders() {
            const res = await fetch(API_URL);
            const orders = await res.json();
            const container = document.getElementById('ordersContainer');

            if (orders.length === 0) {
                container.innerHTML = '<p class="text-center text-muted py-5">No orders yet.</p>';
                return;
            }

            container.innerHTML = orders.map(order => {
                // Format the date
                const date = new Date(order.createdAt).toLocaleString();
                
                // Status badge colors
                let statusClass = 'bg-warning'; // Pending
                if (order.status === 'Processing') statusClass = 'bg-info';
                if (order.status === 'Shipped') statusClass = 'bg-primary';
                if (order.status === 'Delivered') statusClass = 'bg-success';

                return `
                    <div class="card mb-4 shadow-sm border-0 order-card">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="mb-0 fw-bold">${order.customerName}</h6>
                                <small class="text-muted">${date}</small>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="badge ${statusClass}">${order.status}</span>
                                <h5 class="mb-0 text-dark">₹${order.totalAmount.toLocaleString()}</h5>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <strong>Items:</strong>
                                    <ul class="list-group list-group-flush mt-2">
                                        ${order.items.map(item => `
                                            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                                <span>${item.name} <span class="text-muted">(x${item.qty})</span></span>
                                                <span>₹${(item.price * item.qty).toLocaleString()}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <div class="col-md-4 border-start">
                                    <strong>Delivery Address:</strong>
                                    <p class="text-muted small mt-2">${order.address}</p>
                                    
                                    <label class="form-label small fw-bold mt-3">Update Status</label>
                                    <select class="form-select form-select-sm" onchange="updateStatus('${order._id}', this.value)">
                                        <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                        <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                        <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                        <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateStatus(orderId, newStatus) {
            try {
                await fetch(`${API_URL}/${orderId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
            
                loadOrders(); 
            } catch (err) {
                alert('Failed to update status');
            }
        }

        loadOrders();
    </script>
</body>
</html>
